<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>聊天记录 - 郭梦龙的测试</title>
<style>
  body { margin: 0; font-family: "Microsoft YaHei", sans-serif; background: #ededed; }
  .win { width: 900px; margin: 24px auto; background: #f7f7f7; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
  .bar { height: 56px; background: #e9e9e9; display: flex; align-items: center; padding: 0 20px; font-size: 20px; color: #333; border-bottom: 1px solid #ddd; }
  .chat { padding: 28px 32px; min-height: 420px; }
  .msg { margin-bottom: 26px; }
  .who { font-size: 16px; color: #888; margin-bottom: 8px; }
  .bubble { display: inline-block; max-width: 640px; background: #fff; border-radius: 8px; padding: 16px 20px; font-size: 20px; line-height: 1.8; color: #222; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .me .bubble { background: #95ec69; }
  a.link { color: #1b6ef3; text-decoration: underline; font-size: 20px; }
  .hint { margin-top: 28px; font-size: 15px; color: #999; }
</style>
</head>
<body>
<div class="win">
  <div class="bar">郭梦龙的测试</div>
  <div class="chat">
    <div class="msg">
      <div class="who">郭梦龙</div>
      <div class="bubble">
        这是我们部门的安全知识小测验，一共 6 道单选题。<br>
        点下面这个链接进去答题，答完记得提交，把得分告诉我。<br>
        <a class="link" href="quiz.html">点击开始答题：2026 年安全知识测验</a>
      </div>
    </div>
    <div class="msg me">
      <div class="who">我</div>
      <div class="bubble">收到，我看一下。</div>
    </div>
  </div>
</div>
<div class="hint">这是本机生成的测试页面，用于验证桌面操控插件，与真实微信无关。</div>
</body>
</html>
